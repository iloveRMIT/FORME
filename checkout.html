<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — FORME</title><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/pages.css"><link rel="stylesheet" href="css/responsive.css"></head><body data-page="checkout"><main><section class="page-hero"><div class="container"><div class="breadcrumbs"><a href="index.html">Home</a><span>/</span><a href="bag.html">Bag</a><span>/</span>Checkout</div><p class="eyebrow">PROTOTYPE CHECKOUT</p><h1>Almost<br><em>FORME-ready.</em></h1></div></section><section class="container checkout-layout"><div id="checkoutContent"><div class="progress"><span>Bag</span> → <span>Booking</span> → <span class="active">Checkout</span> → <span>Confirmed</span></div><form id="checkoutForm"><div class="form-card"><h2>Contact information</h2><div class="field-grid"><label>Full name<input name="name"></label><label>Email<input name="email" type="email"></label><label>Phone<input name="phone"></label></div></div><div class="form-card"><h2>Delivery information</h2><div class="field-grid"><label>Address<input name="address"></label><label>District<input name="district"></label><label>City<input name="city" value="Ho Chi Minh City"></label></div><label>Delivery notes<textarea name="notes"></textarea></label></div><div class="form-card"><h2>Payment method</h2><label><input type="radio" name="payment" value="Card" checked> Card</label> <label><input type="radio" name="payment" value="Bank Transfer"> Bank transfer</label> <label><input type="radio" name="payment" value="Cash"> Cash / deposit on delivery</label><div class="field-grid" id="cardFields"><label>Card number<input placeholder="0000 0000 0000 0000"></label><label>MM / YY<input placeholder="MM / YY"></label><label>CVC<input placeholder="CVC"></label></div><p class="fine">Prototype checkout — no payment will be processed.</p></div><p class="form-message" id="checkoutMessage"></p><button class="button dark">Confirm prototype booking</button></form></div><aside><div id="checkoutSummary"></div><p class="fine" id="checkoutWindow"></p></aside></section></main><script src="js/data.js"></script><script src="js/common.js"></script><script src="js/pages.js"></script></body></html>
